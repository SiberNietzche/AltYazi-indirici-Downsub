plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Sürüm ve yt-dlp sürümü masaüstü programıyla aynı yerden okunur.
def repo = rootProject.projectDir.parentFile
def appVersion = (new File(repo, "src/altyazi/__init__.py").text =~ /__version__ = "([^"]+)"/)[0][1]
def ytDlp = new File(repo, "requirements.txt").readLines().find { it.startsWith("yt-dlp") }.replace("[default]", "")

// İmza anahtarı depoya girmez; android/keystore.properties varsa yayın sürümü onunla imzalanır.
def keystoreFile = rootProject.file("keystore.properties")
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

// Çıktı adı diğer sistemlerle aynı düzendedir: AltyaziIndirici_<sürüm>_android-<tür>.apk
base {
    archivesName = "AltyaziIndirici_${appVersion}_android"
}

android {
    namespace 'org.cybergah.altyazi'
    compileSdk 35

    defaultConfig {
        applicationId "org.cybergah.altyazi"
        // Android 7 ve üstü. Android 11'den itibaren İndirilenler klasörüne izinsiz yazılır;
        // daha eski sürümlerde depolama izni istenir (bkz. MainActivity).
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName appVersion
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystore["storeFile"])
                storePassword keystore["storePassword"]
                keyAlias keystore["keyAlias"]
                keyPassword keystore["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
        pip {
            install ytDlp
            install "certifi"
        }
        // Arayüz dosyaları (altyazi/web) gerçek dosya olarak açılır; sunucu onları diskten okur.
        extractPackages "altyazi"
    }
    sourceSets {
        main {
            srcDir "../../src"
        }
    }
}
