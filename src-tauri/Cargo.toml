[package]
name = "altyazi-indirici"
version = "1.0.0"
description = "Altyazı İndirici masaüstü kabuğu"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
