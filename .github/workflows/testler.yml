# Her gönderimde ve çekme isteğinde testleri Windows ve Linux'ta çalıştırır.
# Derleme iş akışı yalnızca etikette çalıştığı için hatalar burada erken görünür.
name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testler:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: yt-dlp
        shell: bash
        run: python -m pip install -q "$(grep '^yt-dlp' requirements.txt)"
      - name: Testler
        run: python -m unittest discover -s tests
