# Windows, Linux ve Android paketlerini derler. Elle (Actions > Derleme > Run workflow) ya da
# "v" ile başlayan bir etiket gönderilince çalışır; çıktılar çalışmanın "Artifacts" bölümünde durur.
name: Derleme

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Derle
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*_windows.exe
          if-no-files-found: error

  linux:
    # Eski bir Ubuntu'da derlenen paket daha yeni dağıtımlarda da çalışır.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Sistem kitaplıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Derle
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*_linux.deb
            dist/*_linux.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      # Depo ayarlarında ANDROID_KEYSTORE_BASE64 tanımlıysa yayın sürümü o anahtarla imzalanır.
      # Tanımlı değilse hata ayıklama sürümü derlenir; GitHub her çalışmada yeni bir hata ayıklama
      # anahtarı ürettiği için o APK önceki sürümün üzerine kurulamaz.
      IMZALI: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Testler
        run: |
          python -m pip install -q "$(grep '^yt-dlp' requirements.txt)"
          python -m unittest discover -s tests
      - name: İmza anahtarı
        if: env.IMZALI == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Derle
        working-directory: android
        run: |
          if [ "$IMZALI" = "true" ]; then
            ./gradlew assembleRelease --console=plain
          else
            ./gradlew assembleDebug --console=plain
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
