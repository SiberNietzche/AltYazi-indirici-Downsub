# Windows, macOS, Linux ve Android paketlerini derler. Elle (Actions > Derleme > Run workflow) ya da
# "v" ile başlayan bir etiket gönderilince çalışır; çıktılar çalışmanın "Artifacts" bölümünde durur.
name: Derleme

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Derle
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*_windows.exe
          if-no-files-found: error

  macos:
    # Tek bir universal (arm64 + x86_64) .dmg derlenir. GitHub'ın Apple Silicon makineleri sık sık
    # kapasite yüzünden sırada kaldığı için Intel makinesi kullanılır; çıktı iki mimaride de aynıdır.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      # actions/setup-python yalnızca makinenin mimarisini kurar; universal2 yan süreç için
      # python.org'un iki mimarili Python'u gerekir.
      - name: Python 3.11 (universal2)
        run: |
          curl -fsSL -o python.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -c "import sysconfig; print(sysconfig.get_platform())"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Derle
        env:
          PYTHON: /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
        run: ./build_macos.sh
      # Uygulama ve yan süreç iki mimariyi de içermeli; makinenin kendi mimarisinde açılabilmeli.
      # Apple Silicon makinesinde x86_64 kısmı Rosetta ile de denenir (Intel'de arm64 çalıştırılamaz).
      - name: Sına
        run: |
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          server="$app/Contents/MacOS/altyazi-server"
          for binary in "$app"/Contents/MacOS/*; do
            lipo -info "$binary"
            lipo "$binary" -verify_arch arm64 x86_64
          done
          codesign --verify --deep --verbose=2 "$app"
          "$server" --help
          if [ "$(uname -m)" = arm64 ]; then
            arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
            arch -x86_64 "$server" --help
          fi
          # Motor gerçekten açılmalı: kabuk 60 saniye bekler, burada 30 saniyede yanıt vermesi istenir.
          (sleep 60 | "$server" --serve --exit-with-stdin --port 8765 --token t) &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:8765/?token=t" && { echo "motor $i saniyede açıldı"; break; }
            [ "$i" = 30 ] && { echo "motor 30 saniyede açılmadı"; exit 1; }
            sleep 1
          done
          pkill -f "altyazi-server --serve" || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*_macos.dmg
          if-no-files-found: error

  linux:
    # Eski bir Ubuntu'da derlenen paket daha yeni dağıtımlarda da çalışır.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Sistem kitaplıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Derle
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*_linux.deb
            dist/*_linux.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Testler
        run: |
          python -m pip install -q "$(grep '^yt-dlp' requirements.txt)"
          python -m unittest discover -s tests
      # Buradaki APK her seferinde başka bir geçici anahtarla imzalanır ve kurulu uygulamanın üzerine
      # kurulamaz. Yalnızca derlemenin çalıştığını sınamak içindir; yayın APK'sı yayın anahtarının
      # bulunduğu bilgisayarda assembleRelease ile derlenir (bkz. README, Android).
      - name: Derle (yalnızca sınama)
        working-directory: android
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-yalnizca-sinama-yayimlamayin
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
