# Yalnızca mac-test dalında: yayımlanan macOS DMG'sini gerçek Mac makinelerinde açılış testinden geçirir.
name: Mac açılış testi

on:
  push:
    branches: [mac-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kur ve sına
        run: bash .github/mac-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonuc-${{ matrix.runner }}
          path: sonuc/
